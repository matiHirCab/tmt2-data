name: Workspace CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      network_diagnostics:
        description: Also run the two live DNS tests (real failures fail the diagnostic job)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: workspace-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: Workspace (${{ matrix.mode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.network_diagnostics && '[{"mode":"core","runner":"ubuntu-24.04"},{"mode":"browser","runner":"macos-15"},{"mode":"network","runner":"ubuntu-24.04"}]' || '[{"mode":"core","runner":"ubuntu-24.04"},{"mode":"browser","runner":"macos-15"}]') }}
    defaults:
      run:
        shell: bash
        working-directory: tmt2-data
    steps:
      - name: Checkout the data commit under test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, reviewed 2026-09-30
        with:
          path: tmt2-data
          persist-credentials: false
          clean: false
          set-safe-directory: false
      - name: Read and validate exact pins (no network)
        id: pins
        run: node tools/ci/pins.mjs outputs
      - name: Checkout pinned server
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: matiHirCab/Pokemon-Too-Many-Types-2
          ref: ${{ steps.pins.outputs.server_sha }}
          path: Pokemon-Too-Many-Types-2
          fetch-depth: 0 # inherited-source guard needs the pinned original ancestor
          persist-credentials: false
          clean: false
          set-safe-directory: false
      - name: Checkout pinned client
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: matiHirCab/Pokemon-Too-Many-Types-2-client
          ref: ${{ steps.pins.outputs.client_sha }}
          path: Pokemon-Too-Many-Types-2-client
          persist-credentials: false
          clean: false
          set-safe-directory: false
      - name: Set exact Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, reviewed 2026-09-30
        with:
          node-version: ${{ steps.pins.outputs.node }}
          package-manager-cache: false
      - name: Set exact npm
        env:
          NPM_VERSION: ${{ steps.pins.outputs.npm }}
        run: npm install --global "npm@$NPM_VERSION" --ignore-scripts --no-audit --no-fund
      - name: Verify checkout and tool pins before installation
        run: node tools/ci/pins.mjs verify
      - name: Prepare private beta from clean lockfile checkouts
        env:
          CI_MODE: ${{ matrix.mode }}
        run: |
          if [ "$CI_MODE" = network ]; then
            npm ci --no-audit --no-fund
            npm ci --prefix ../Pokemon-Too-Many-Types-2 --no-audit --no-fund
            npm ci --prefix ../Pokemon-Too-Many-Types-2-client --no-audit --no-fund
          else
            npm run beta:prepare
          fi
      - name: Install byte-pinned matching Showdown art (setup only)
        if: matrix.mode != 'network'
        run: npm run sprites:install
      - name: Run the selected CI profile
        env:
          CI: true
          CI_MODE: ${{ matrix.mode }}
          NODE_OPTIONS: --max-old-space-size=4096 # full upstream server lint needs more than arm64 default 2 GiB
        run: |
          if [ "$CI_MODE" = browser ]; then
            npm run ci:core
          else
            npm run "ci:$CI_MODE"
          fi
      - name: Install pinned browser (no host/security changes)
        if: matrix.mode == 'browser'
        run: npx --no-install playwright install chromium
      - name: Native browser regression (sandbox required)
        if: matrix.mode == 'browser'
        env:
          CI: true
          TMT2_LOCAL_GUESTS: '0'
          TMT2_REQUIRE_SHOWDOWN_ART: '1'
        run: npm run ci:browser
      - name: Preserve native browser report and local sprite screenshots
        if: always() && matrix.mode == 'browser'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, reviewed 2026-10-03
        with:
          name: tmt11-native-browser-${{ github.sha }}
          path: tmt2-data/.local/evidence/tmt11-browser/
          include-hidden-files: true # exact report directory only; no config/sprites/credentials
          if-no-files-found: warn # runner may fail before report creation; job remains failed
          retention-days: 7
      - name: Explain scope and exclusions even on failure
        if: always()
        env:
          CI_MODE: ${{ matrix.mode }}
        run: |
          node -e 'const fs=require("fs"); fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Profile: ${process.env.CI_MODE}. Core does NOT run the two named live-DNS tests; use workflow_dispatch network_diagnostics=true to run them with real exit status. Upstream slow tests remain excluded. Missing client assets can skip upstream tests. Core includes bounded adaptation simulator checks; browser regression requires its own successful step. Neither is owner review, live two-player acceptance or ROM fidelity. See docs/CI.md and docs/BASELINE_COMPARISON.md.\n`);'
